name: Frontend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_e2e:
        description: "Run full frontend E2E gates"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: read

jobs:
  release-local:
    name: release-local
    runs-on: ubuntu-latest
    env:
      CONTROLHUB_BACKEND_DIR: controlhub-backend
    steps:
      - uses: actions/checkout@v4

      # The backend companion object is pinned in e2e/backend-fixture.env —
      # the single reviewed source of truth shared by both jobs. Never follow
      # a moving branch here.
      - name: Resolve pinned backend ref
        id: backend-pin
        run: |
          sha="$(sed -n 's/^CONTROLHUB_BACKEND_SHA=//p' e2e/backend-fixture.env)"
          tree="$(sed -n 's/^CONTROLHUB_BACKEND_TREE=//p' e2e/backend-fixture.env)"
          test "${#sha}" = "40" || { echo "e2e/backend-fixture.env lacks a full 40-hex SHA"; exit 1; }
          test "${#tree}" = "40" || { echo "e2e/backend-fixture.env lacks a full 40-hex tree"; exit 1; }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "tree=$tree" >> "$GITHUB_OUTPUT"

      - name: Checkout backend (pinned)
        uses: actions/checkout@v4
        with:
          repository: Fanduzi/ControlHub-Backend
          ref: ${{ steps.backend-pin.outputs.sha }}
          path: ${{ env.CONTROLHUB_BACKEND_DIR }}

      - name: Verify backend checkout identity
        run: |
          cd ${{ env.CONTROLHUB_BACKEND_DIR }}
          head="$(git rev-parse HEAD)"
          tree="$(git rev-parse 'HEAD^{tree}')"
          echo "backend HEAD=$head tree=$tree"
          test "$head" = "${{ steps.backend-pin.outputs.sha }}"
          test "$tree" = "${{ steps.backend-pin.outputs.tree }}"

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.tool-versions'
          cache: npm
      - name: Verify Node runtime
        run: |
          node --version
          npm run check:runtime
      - name: Install dependencies
        run: npm ci
      - name: Run frontend local release gates
        run: npm run release:local

  release-e2e:
    name: release-e2e
    runs-on: ubuntu-latest
    # The full real-Chromium suite needs ~23-25 min on shared runners (prior
    # green runs took ~23 min at a 25-min cap). 45 min gives headroom for
    # Playwright-browser download stalls and runner contention without masking
    # any test result.
    timeout-minutes: 45
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: controlhub
          MYSQL_USER: controlhub
          MYSQL_PASSWORD: controlhub_dev
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    env:
      BACKEND_DIR: controlhub-backend
      # Per-run identity shared by the fixture listener, the playwright-managed
      # api-proxy, and the mandatory gate/spec checks.
      E2E_RUN_ID: e2e-ci-${{ github.run_id }}-${{ github.run_attempt }}
      E2E_PG_CONTAINER: chub-pg-ci-${{ github.run_id }}-${{ github.run_attempt }}
      # Dedicated disposable E2E metadata database. The fixture provisioning
      # seam (backend cmd/e2e-fixture-bootstrap) refuses the default
      # `controlhub` database and requires a *_e2e name; the backend server
      # also serves this database so the whole E2E run is isolated.
      DATABASE_DSN: controlhub:controlhub_dev@tcp(127.0.0.1:3306)/controlhub_e2e?parseTime=true&charset=utf8mb4
      E2E_FIXTURE_DATABASE_DSN: controlhub:controlhub_dev@tcp(127.0.0.1:3306)/controlhub_e2e?parseTime=true&charset=utf8mb4
      CONTROLHUB_E2E_FIXTURE_MODE: "1"
      JWT_SECRET: ci-e2e-secret-must-be-at-least-32b
      APP_PORT: "8080"
      PLAYWRIGHT_PROXY_TARGET: http://localhost:8080
      PLAYWRIGHT_PROXY_PORT: "8081"
      NEXT_PUBLIC_API_BASE_URL: /__api
      CONTROLHUB_API_BASE_URL: http://localhost:8081
      CONTROLHUB_API_PROXY_URL: http://localhost:8081
      CONTROLHUB_QUERY_CREDENTIAL_LOCAL_QUERY_RO: "query_e2e_ro:ci_password@tcp(127.0.0.1:3306)/query_e2e?parseTime=true&charset=utf8mb4"
    steps:
      - name: Checkout frontend
        uses: actions/checkout@v4

      # Same pinned companion object as release-local — one reviewed source
      # (e2e/backend-fixture.env), never a moving branch.
      - name: Resolve pinned backend ref
        id: backend-pin
        run: |
          sha="$(sed -n 's/^CONTROLHUB_BACKEND_SHA=//p' e2e/backend-fixture.env)"
          tree="$(sed -n 's/^CONTROLHUB_BACKEND_TREE=//p' e2e/backend-fixture.env)"
          test "${#sha}" = "40" || { echo "e2e/backend-fixture.env lacks a full 40-hex SHA"; exit 1; }
          test "${#tree}" = "40" || { echo "e2e/backend-fixture.env lacks a full 40-hex tree"; exit 1; }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "tree=$tree" >> "$GITHUB_OUTPUT"

      - name: Checkout backend (pinned)
        uses: actions/checkout@v4
        with:
          repository: Fanduzi/ControlHub-Backend
          ref: ${{ steps.backend-pin.outputs.sha }}
          path: ${{ env.BACKEND_DIR }}

      - name: Verify backend checkout identity
        run: |
          cd ${{ env.BACKEND_DIR }}
          head="$(git rev-parse HEAD)"
          tree="$(git rev-parse 'HEAD^{tree}')"
          echo "backend HEAD=$head tree=$tree"
          test "$head" = "${{ steps.backend-pin.outputs.sha }}"
          test "$tree" = "${{ steps.backend-pin.outputs.tree }}"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.tool-versions'
          cache: npm
      - name: Verify Node runtime
        run: |
          node --version
          npm run check:runtime

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: ${{ env.BACKEND_DIR }}/go.mod
          cache-dependency-path: ${{ env.BACKEND_DIR }}/go.sum

      - name: Install frontend dependencies
        run: npm ci

      - name: Install goose
        working-directory: ${{ env.BACKEND_DIR }}
        run: go install github.com/pressly/goose/v3/cmd/goose@v3.27.0

      - name: Wait for MySQL
        run: |
          for i in {1..30}; do
            if mysqladmin ping -h 127.0.0.1 -uroot -proot --silent; then
              exit 0
            fi
            sleep 2
          done
          echo "MySQL did not become ready."
          exit 1

      # Dedicated disposable Query E2E MySQL fixture (container :13306, ro
      # user, query_e2e + query_e2e_aux fixture data) — the same
      # backend-owned script local runs use. Its per-identity state file hands
      # off the read-only DSN; the password is masked and never printed.
      - name: Start Query E2E MySQL fixture
        working-directory: ${{ env.BACKEND_DIR }}
        run: bash scripts/query-e2e-mysql.sh up

      - name: Load query fixture credential state
        working-directory: ${{ env.BACKEND_DIR }}
        run: |
          ENV_FILE="$(bash scripts/query-e2e-mysql.sh env-file)"
          test -r "$ENV_FILE" || { echo "fixture state file missing after up"; exit 1; }
          PW="$(sed -n 's/^QUERY_E2E_MYSQL_READONLY_PASSWORD=//p' "$ENV_FILE")"
          echo "::add-mask::$PW"
          set -a; . "$ENV_FILE"; set +a
          echo "::add-mask::$CONTROLHUB_QUERY_CREDENTIAL_LOCAL_QUERY_RO"
          echo "CONTROLHUB_QUERY_CREDENTIAL_LOCAL_QUERY_RO=$CONTROLHUB_QUERY_CREDENTIAL_LOCAL_QUERY_RO" >> "$GITHUB_ENV"

      - name: Create disposable E2E metadata database
        run: |
          mysql -h 127.0.0.1 -uroot -proot <<'SQL'
          SET GLOBAL log_bin_trust_function_creators = 1;
          CREATE DATABASE IF NOT EXISTS controlhub_e2e CHARACTER SET utf8mb4 COLLATE utf8mb4_0900_ai_ci;
          GRANT ALL PRIVILEGES ON controlhub_e2e.* TO 'controlhub'@'%';
          FLUSH PRIVILEGES;
          SQL

      - name: Run backend migrations
        working-directory: ${{ env.BACKEND_DIR }}
        run: make migrate-up

      - name: Seed query dev target
        working-directory: ${{ env.BACKEND_DIR }}
        env:
          QUERY_DEV_CREDENTIAL_REF: LOCAL_QUERY_RO
          QUERY_DEV_ALLOW_TARGET_FIXTURE: "true"
        run: go run ./cmd/querydev

      # Migration 00016 disabled the published 0002 seed accounts. Real E2E
      # uses explicit per-run fixture operators provisioned by the backend
      # TEST/CI-ONLY seam cmd/e2e-fixture-bootstrap (refuses the retired seeds).
      # Passwords are generated per run, masked, and never printed.
      - name: Provision E2E fixture operators
        id: provision
        working-directory: ${{ env.BACKEND_DIR }}
        run: |
          set -euo pipefail
          ADMIN_EMAIL="e2e-admin-${GITHUB_RUN_ID}@controlhub-e2e.invalid"
          EDITOR_EMAIL="e2e-editor-${GITHUB_RUN_ID}@controlhub-e2e.invalid"
          ADMIN_PW="$(openssl rand -hex 24)"
          EDITOR_PW="$(openssl rand -hex 24)"
          echo "::add-mask::$ADMIN_PW"
          echo "::add-mask::$EDITOR_PW"
          CONTROLHUB_E2E_FIXTURE_MODE="$CONTROLHUB_E2E_FIXTURE_MODE" \
          E2E_FIXTURE_DATABASE_DSN="$E2E_FIXTURE_DATABASE_DSN" \
          E2E_FIXTURE_ADMIN_EMAIL="$ADMIN_EMAIL" \
          E2E_FIXTURE_ADMIN_PASSWORD="$ADMIN_PW" \
          E2E_FIXTURE_EDITOR_EMAIL="$EDITOR_EMAIL" \
          E2E_FIXTURE_EDITOR_PASSWORD="$EDITOR_PW" \
          go run ./cmd/e2e-fixture-bootstrap
          {
            echo "admin_email=$ADMIN_EMAIL"
            echo "admin_password=$ADMIN_PW"
            echo "editor_email=$EDITOR_EMAIL"
            echo "editor_password=$EDITOR_PW"
          } >> "$GITHUB_OUTPUT"

      # The published seed accounts must stay disabled on the migrated DB —
      # E2E must never silently resume them.
      - name: Verify retired seed accounts stay disabled
        run: |
          ACTIVE_SEEDS=$(mysql -h 127.0.0.1 -ucontrolhub -pcontrolhub_dev controlhub_e2e -N -e \
            "SELECT COUNT(*) FROM users WHERE email IN ('admin@example.com','editor@example.com') AND is_active = 1")
          echo "active retired-seed accounts: $ACTIVE_SEEDS"
          if [ "$ACTIVE_SEEDS" != "0" ]; then
            echo "migration 00016 must leave the published seed accounts disabled"
            exit 1
          fi

      # The full suite's backend is the TEST/CI-ONLY cmd/e2e-pg-server listener
      # built from the pinned object: identical serverboot production graph
      # plus the two construction-time fixture gates (PG HTTP entries +
      # connection lister). A disposable postgres:17.10 container is provisioned
      # with per-run secrets, seeded (labdb/labdb_other + SELECT-only ro_user +
      # credential/policy metadata), and its /e2e/assembly identity is verified
      # (kind, pgEntries, runId, backendSha == pin) before the suite may run.
      - name: Provision PG fixture + start fixture listener
        run: bash scripts/e2e/pg-fixture-up.sh

      - name: Wait for backend health
        run: |
          for i in {1..30}; do
            if curl -fsS http://localhost:8080/health; then
              exit 0
            fi
            sleep 2
          done
          echo "Fixture listener did not become healthy."
          echo "---- fixture-server.log ----"
          cat .e2e-pg-fixture-state/fixture-server.log || true
          exit 1

      - name: Run E2E preflight
        run: npm run check:e2e-preflight

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-
      # ubuntu-latest already ships Chromium's OS dependencies; --with-deps only
      # runs an apt-get update that flakily hangs on Azure Ubuntu mirrors and
      # cancelled the job before any E2E test ran. Install the browser alone.
      - name: Install Playwright browsers
        run: npx playwright install chromium

      - name: Run frontend E2E release gates
        env:
          E2E_FIXTURE_ADMIN_EMAIL: ${{ steps.provision.outputs.admin_email }}
          E2E_FIXTURE_ADMIN_PASSWORD: ${{ steps.provision.outputs.admin_password }}
          E2E_FIXTURE_EDITOR_EMAIL: ${{ steps.provision.outputs.editor_email }}
          E2E_FIXTURE_EDITOR_PASSWORD: ${{ steps.provision.outputs.editor_password }}
        run: npm run release:e2e

      # Teardown only this run's owned resources (recorded PID + container ID
      # in .e2e-pg-fixture-state) — never name/prefix matches.
      - name: Teardown PG fixture
        if: always()
        run: |
          bash scripts/e2e/pg-fixture-down.sh
          (cd ${{ env.BACKEND_DIR }} && bash scripts/query-e2e-mysql.sh down) || true

      - name: Upload E2E artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-cross-repo-e2e-artifacts
          path: |
            playwright-report/
            test-results/
            .e2e-pg-fixture-state/fixture-server.log
            .e2e-pg-fixture-state/pg-seed.log
            .e2e-pg-fixture-state/assembly.json
          if-no-files-found: ignore
          retention-days: 7
