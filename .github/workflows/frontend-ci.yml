name: Frontend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_e2e:
        description: "Run full frontend E2E gates"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: read

jobs:
  release-local:
    name: release-local
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.tool-versions'
          cache: npm
      - name: Verify Node runtime
        run: |
          node --version
          npm run check:runtime
      - name: Install dependencies
        run: npm ci
      - name: Run frontend local release gates
        run: npm run release:local

  release-e2e:
    name: release-e2e
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: controlhub
          MYSQL_USER: controlhub
          MYSQL_PASSWORD: controlhub_dev
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    env:
      BACKEND_DIR: controlhub-backend
      DATABASE_DSN: controlhub:controlhub_dev@tcp(127.0.0.1:3306)/controlhub?parseTime=true&charset=utf8mb4
      JWT_SECRET: ci-e2e-secret-must-be-at-least-32b
      APP_PORT: "8080"
      PLAYWRIGHT_PROXY_TARGET: http://localhost:8080
      PLAYWRIGHT_PROXY_PORT: "8081"
      NEXT_PUBLIC_API_BASE_URL: /__api
      CONTROLHUB_API_BASE_URL: http://localhost:8081
      CONTROLHUB_API_PROXY_URL: http://localhost:8081
      CONTROLHUB_QUERY_CREDENTIAL_LOCAL_QUERY_RO: "query_e2e_ro:ci_password@tcp(127.0.0.1:3306)/query_e2e?parseTime=true&charset=utf8mb4"
    steps:
      - name: Verify backend checkout token is configured
        env:
          BACKEND_CHECKOUT_TOKEN: ${{ secrets.CONTROLHUB_BACKEND_CHECKOUT_TOKEN }}
        run: |
          if [ -z "$BACKEND_CHECKOUT_TOKEN" ]; then
            echo "CONTROLHUB_BACKEND_CHECKOUT_TOKEN is required to checkout the private backend repository."
            exit 1
          fi

      - name: Checkout frontend
        uses: actions/checkout@v4

      - name: Checkout backend
        uses: actions/checkout@v4
        with:
          repository: Fanduzi/ControlHub-Backend
          token: ${{ secrets.CONTROLHUB_BACKEND_CHECKOUT_TOKEN }}
          path: ${{ env.BACKEND_DIR }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.tool-versions'
          cache: npm
      - name: Verify Node runtime
        run: |
          node --version
          npm run check:runtime

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: ${{ env.BACKEND_DIR }}/go.mod
          cache-dependency-path: ${{ env.BACKEND_DIR }}/go.sum

      - name: Install frontend dependencies
        run: npm ci

      - name: Install goose
        working-directory: ${{ env.BACKEND_DIR }}
        run: go install github.com/pressly/goose/v3/cmd/goose@v3.27.0

      - name: Wait for MySQL
        run: |
          for i in {1..30}; do
            if mysqladmin ping -h 127.0.0.1 -uroot -proot --silent; then
              exit 0
            fi
            sleep 2
          done
          echo "MySQL did not become ready."
          exit 1

      - name: Create query_e2e databases and seed tables
        run: |
          mysql -h 127.0.0.1 -uroot -proot <<'SQL'
          CREATE DATABASE IF NOT EXISTS query_e2e;
          CREATE DATABASE IF NOT EXISTS query_e2e_aux;

          USE query_e2e;

          CREATE TABLE IF NOT EXISTS query_e2e_items (
            id bigint unsigned NOT NULL PRIMARY KEY,
            name varchar(64) NOT NULL,
            category varchar(32) NOT NULL,
            created_at timestamp NOT NULL DEFAULT CURRENT_TIMESTAMP
          );
          INSERT INTO query_e2e_items (id, name, category) VALUES
            (1, 'alpha', 'sample'), (2, 'beta', 'sample')
          ON DUPLICATE KEY UPDATE name=VALUES(name), category=VALUES(category);

          CREATE TABLE IF NOT EXISTS qe_explain_big (
            id bigint unsigned NOT NULL PRIMARY KEY,
            payload varchar(64) NOT NULL,
            created_at timestamp NOT NULL DEFAULT CURRENT_TIMESTAMP
          ) ENGINE=InnoDB;
          INSERT IGNORE INTO qe_explain_big (id, payload) VALUES
            (1,'row-001'),(2,'row-002'),(3,'row-003'),(4,'row-004'),(5,'row-005'),
            (6,'row-006'),(7,'row-007'),(8,'row-008'),(9,'row-009'),(10,'row-010'),
            (11,'row-011'),(12,'row-012'),(13,'row-013'),(14,'row-014'),(15,'row-015'),
            (16,'row-016'),(17,'row-017'),(18,'row-018'),(19,'row-019'),(20,'row-020'),
            (21,'row-021'),(22,'row-022'),(23,'row-023'),(24,'row-024'),(25,'row-025'),
            (26,'row-026'),(27,'row-027'),(28,'row-028'),(29,'row-029'),(30,'row-030'),
            (31,'row-031'),(32,'row-032'),(33,'row-033'),(34,'row-034'),(35,'row-035'),
            (36,'row-036'),(37,'row-037'),(38,'row-038'),(39,'row-039'),(40,'row-040'),
            (41,'row-041'),(42,'row-042'),(43,'row-043'),(44,'row-044'),(45,'row-045'),
            (46,'row-046'),(47,'row-047'),(48,'row-048'),(49,'row-049'),(50,'row-050'),
            (51,'row-051'),(52,'row-052'),(53,'row-053'),(54,'row-054'),(55,'row-055'),
            (56,'row-056'),(57,'row-057'),(58,'row-058'),(59,'row-059'),(60,'row-060'),
            (61,'row-061'),(62,'row-062'),(63,'row-063'),(64,'row-064'),(65,'row-065'),
            (66,'row-066'),(67,'row-067'),(68,'row-068'),(69,'row-069'),(70,'row-070'),
            (71,'row-071'),(72,'row-072'),(73,'row-073'),(74,'row-074'),(75,'row-075'),
            (76,'row-076'),(77,'row-077'),(78,'row-078'),(79,'row-079'),(80,'row-080'),
            (81,'row-081'),(82,'row-082'),(83,'row-083'),(84,'row-084'),(85,'row-085'),
            (86,'row-086'),(87,'row-087'),(88,'row-088'),(89,'row-089'),(90,'row-090'),
            (91,'row-091'),(92,'row-092'),(93,'row-093'),(94,'row-094'),(95,'row-095'),
            (96,'row-096'),(97,'row-097'),(98,'row-098'),(99,'row-099'),(100,'row-100');

          USE query_e2e_aux;

          CREATE TABLE IF NOT EXISTS schema_parent (
            id bigint unsigned NOT NULL AUTO_INCREMENT,
            parent_code varchar(32) NOT NULL,
            label varchar(128) NOT NULL DEFAULT '',
            created_at timestamp NOT NULL DEFAULT CURRENT_TIMESTAMP,
            PRIMARY KEY (id),
            UNIQUE KEY uq_schema_parent_code (parent_code),
            KEY idx_schema_parent_label (label)
          ) ENGINE=InnoDB;

          CREATE TABLE IF NOT EXISTS schema_child (
            id bigint unsigned NOT NULL AUTO_INCREMENT,
            parent_id bigint unsigned NOT NULL,
            child_name varchar(64) NOT NULL,
            sort_order int NOT NULL DEFAULT 0,
            PRIMARY KEY (id),
            KEY idx_schema_child_parent (parent_id, sort_order),
            CONSTRAINT fk_schema_child_parent FOREIGN KEY (parent_id) REFERENCES schema_parent (id) ON UPDATE CASCADE ON DELETE RESTRICT
          ) ENGINE=InnoDB;
          INSERT IGNORE INTO schema_parent (id, parent_code, label) VALUES
            (1, 'P_ALPHA', 'Alpha Parent'), (2, 'P_BETA', 'Beta Parent');
          INSERT IGNORE INTO schema_child (id, parent_id, child_name, sort_order) VALUES
            (1, 1, 'child_a1', 1), (2, 1, 'child_a2', 2), (3, 2, 'child_b1', 1);

          -- Pagination fixture: 26 tables for schema object page 2 tests
          CREATE TABLE IF NOT EXISTS schema_zz_page_01 (id bigint unsigned NOT NULL PRIMARY KEY, label varchar(128) NOT NULL DEFAULT '') ENGINE=InnoDB;
          CREATE TABLE IF NOT EXISTS schema_zz_page_02 (id bigint unsigned NOT NULL PRIMARY KEY, label varchar(128) NOT NULL DEFAULT '') ENGINE=InnoDB;
          CREATE TABLE IF NOT EXISTS schema_zz_page_03 (id bigint unsigned NOT NULL PRIMARY KEY, label varchar(128) NOT NULL DEFAULT '') ENGINE=InnoDB;
          CREATE TABLE IF NOT EXISTS schema_zz_page_04 (id bigint unsigned NOT NULL PRIMARY KEY, label varchar(128) NOT NULL DEFAULT '') ENGINE=InnoDB;
          CREATE TABLE IF NOT EXISTS schema_zz_page_05 (id bigint unsigned NOT NULL PRIMARY KEY, label varchar(128) NOT NULL DEFAULT '') ENGINE=InnoDB;
          CREATE TABLE IF NOT EXISTS schema_zz_page_06 (id bigint unsigned NOT NULL PRIMARY KEY, label varchar(128) NOT NULL DEFAULT '') ENGINE=InnoDB;
          CREATE TABLE IF NOT EXISTS schema_zz_page_07 (id bigint unsigned NOT NULL PRIMARY KEY, label varchar(128) NOT NULL DEFAULT '') ENGINE=InnoDB;
          CREATE TABLE IF NOT EXISTS schema_zz_page_08 (id bigint unsigned NOT NULL PRIMARY KEY, label varchar(128) NOT NULL DEFAULT '') ENGINE=InnoDB;
          CREATE TABLE IF NOT EXISTS schema_zz_page_09 (id bigint unsigned NOT NULL PRIMARY KEY, label varchar(128) NOT NULL DEFAULT '') ENGINE=InnoDB;
          CREATE TABLE IF NOT EXISTS schema_zz_page_10 (id bigint unsigned NOT NULL PRIMARY KEY, label varchar(128) NOT NULL DEFAULT '') ENGINE=InnoDB;
          CREATE TABLE IF NOT EXISTS schema_zz_page_11 (id bigint unsigned NOT NULL PRIMARY KEY, label varchar(128) NOT NULL DEFAULT '') ENGINE=InnoDB;
          CREATE TABLE IF NOT EXISTS schema_zz_page_12 (id bigint unsigned NOT NULL PRIMARY KEY, label varchar(128) NOT NULL DEFAULT '') ENGINE=InnoDB;
          CREATE TABLE IF NOT EXISTS schema_zz_page_13 (id bigint unsigned NOT NULL PRIMARY KEY, label varchar(128) NOT NULL DEFAULT '') ENGINE=InnoDB;
          CREATE TABLE IF NOT EXISTS schema_zz_page_14 (id bigint unsigned NOT NULL PRIMARY KEY, label varchar(128) NOT NULL DEFAULT '') ENGINE=InnoDB;
          CREATE TABLE IF NOT EXISTS schema_zz_page_15 (id bigint unsigned NOT NULL PRIMARY KEY, label varchar(128) NOT NULL DEFAULT '') ENGINE=InnoDB;
          CREATE TABLE IF NOT EXISTS schema_zz_page_16 (id bigint unsigned NOT NULL PRIMARY KEY, label varchar(128) NOT NULL DEFAULT '') ENGINE=InnoDB;
          CREATE TABLE IF NOT EXISTS schema_zz_page_17 (id bigint unsigned NOT NULL PRIMARY KEY, label varchar(128) NOT NULL DEFAULT '') ENGINE=InnoDB;
          CREATE TABLE IF NOT EXISTS schema_zz_page_18 (id bigint unsigned NOT NULL PRIMARY KEY, label varchar(128) NOT NULL DEFAULT '') ENGINE=InnoDB;
          CREATE TABLE IF NOT EXISTS schema_zz_page_19 (id bigint unsigned NOT NULL PRIMARY KEY, label varchar(128) NOT NULL DEFAULT '') ENGINE=InnoDB;
          CREATE TABLE IF NOT EXISTS schema_zz_page_20 (id bigint unsigned NOT NULL PRIMARY KEY, label varchar(128) NOT NULL DEFAULT '') ENGINE=InnoDB;
          CREATE TABLE IF NOT EXISTS schema_zz_page_21 (id bigint unsigned NOT NULL PRIMARY KEY, label varchar(128) NOT NULL DEFAULT '') ENGINE=InnoDB;
          CREATE TABLE IF NOT EXISTS schema_zz_page_22 (id bigint unsigned NOT NULL PRIMARY KEY, label varchar(128) NOT NULL DEFAULT '') ENGINE=InnoDB;
          CREATE TABLE IF NOT EXISTS schema_zz_page_23 (id bigint unsigned NOT NULL PRIMARY KEY, label varchar(128) NOT NULL DEFAULT '') ENGINE=InnoDB;
          CREATE TABLE IF NOT EXISTS schema_zz_page_24 (id bigint unsigned NOT NULL PRIMARY KEY, label varchar(128) NOT NULL DEFAULT '') ENGINE=InnoDB;
          CREATE TABLE IF NOT EXISTS schema_zz_page_25 (id bigint unsigned NOT NULL PRIMARY KEY, label varchar(128) NOT NULL DEFAULT '') ENGINE=InnoDB;
          CREATE TABLE IF NOT EXISTS schema_zz_page_26 (id bigint unsigned NOT NULL PRIMARY KEY, label varchar(128) NOT NULL DEFAULT '') ENGINE=InnoDB;

          CREATE OR REPLACE VIEW schema_parent_summary AS SELECT id, parent_code, label FROM schema_parent;

          CREATE USER IF NOT EXISTS 'query_e2e_ro'@'%' IDENTIFIED BY 'ci_password';
          GRANT SELECT ON query_e2e.* TO 'query_e2e_ro'@'%';
          GRANT SELECT ON query_e2e_aux.* TO 'query_e2e_ro'@'%';
          FLUSH PRIVILEGES;
          SQL

      - name: Run backend migrations
        working-directory: ${{ env.BACKEND_DIR }}
        run: make migrate-up

      - name: Seed query dev target
        working-directory: ${{ env.BACKEND_DIR }}
        env:
          QUERY_DEV_CREDENTIAL_REF: LOCAL_QUERY_RO
          QUERY_DEV_ALLOW_TARGET_FIXTURE: "true"
        run: go run ./cmd/querydev

      # Migration 00016 disables the published seed users. E2E still authenticates
      # as admin@example.com / secret123 via the Console BFF, so recreate that
      # operator explicitly for the CI database.
      - name: Bootstrap E2E admin operator
        working-directory: ${{ env.BACKEND_DIR }}
        env:
          BOOTSTRAP_ADMIN_EMAIL: admin@example.com
          BOOTSTRAP_ADMIN_PASSWORD: secret123
        run: go run ./cmd/bootstrap-admin

      # Shared-template E2E covers non-admin editor flows with editor@example.com.
      # 00016 disables that seed user; reactivate with the published secret123 hash.
      - name: Reactivate E2E editor operator
        run: |
          mysql -h 127.0.0.1 -ucontrolhub -pcontrolhub_dev controlhub <<'SQL'
          UPDATE users
          SET is_active = 1,
              password_hash = 'fcf730b6d95236ecd3c9fc2d92d7b6b2bb061514961aec041d6c7a7192f592e4',
              authorization_version = authorization_version + 1
          WHERE email = 'editor@example.com';
          SQL

      - name: Start backend server
        working-directory: ${{ env.BACKEND_DIR }}
        run: |
          nohup make run > ../backend.log 2>&1 &
          echo $! > ../backend.pid

      - name: Wait for backend health
        run: |
          for i in {1..60}; do
            if curl -fsS http://localhost:8080/health; then
              exit 0
            fi
            sleep 2
          done
          echo "Backend did not become healthy."
          echo "---- backend.log ----"
          cat backend.log || true
          exit 1

      - name: Run E2E preflight
        run: npm run check:e2e-preflight

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run frontend E2E release gates
        run: npm run release:e2e

      - name: Upload E2E artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-cross-repo-e2e-artifacts
          path: |
            playwright-report/
            test-results/
            backend.log
          if-no-files-found: ignore
          retention-days: 7
